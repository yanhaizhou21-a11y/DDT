[package]
name = "ddt-desktop"
version = "1.0.0"
description = "Daily Dashboard Tracker - Personal Ledger Desktop Application"
authors = ["DDT Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
